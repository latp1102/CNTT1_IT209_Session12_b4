name: Build and Deploy Spring Boot to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Spring Boot JAR
        run: gradle bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/latp1102/session12-b4:latest

  deploy-vps:
    name: Deploy to Ubuntu VPS via SSH
    needs: build-image
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container through SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            docker pull ghcr.io/latp1102/session12-b4:latest

            docker stop session12-b4 || true
            docker rm session12-b4 || true

            docker run -d \
              --name session12-b4 \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/latp1102/session12-b4:latest

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/actuator/health; then
                echo "Deployment successful"
                exit 0
              fi
              sleep 3
            done

            docker logs --tail 100 session12-b4
            exit 1
